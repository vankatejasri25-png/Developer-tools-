<!DOCTYPE html>
<html>
<head>
    <title>Display Boxes</title>

    <style>
        h1{
            text-align: center; }
        .bigbox {
            border: 3px solid black;
            background-color:black; 
            margin:50px;
        }
        .smallbox {
            display: inline-block;
             padding:100px;
            border: 2px solid black;
            margin: 10px; }
        .box1 { background-color: brown}
        .box2 { background-color: plum }
        .box3 { background-color:  orchid}
        .box4 { background-color: olivedrab }
        .box5 { background-color:blanchedalmond}
        .box6 { background-color: peachpuff}
        .box7 { background-color: powderblue }
        .box8 { background-color: olive}
        .box9 { background-color: red }
        .box10 { background-color: aqua}
    </style>
</head>
<body>
    <div class="bigbox">
        <div class="smallbox box1"><h1>1</h1></div>
        <div class="smallbox box2"><h1>2</h1></div>
        <div class="smallbox box3"><h1>3</h1></div>
        <div class="smallbox box4"><h1>4</h1></div>
        <div class="smallbox box5"><h1>5</h1></div>
        <div class="smallbox box6"><h1>6</h1></div>
        <div class="smallbox box7"><h1>7</h1></div>
        <div class="smallbox box8"><h1>8</h1></div>
        <div class="smallbox box9"><h1>9</h1></div>
        <div class="smallbox box10"><h1>10</h1></div>
    </div>
</body>
</html>
