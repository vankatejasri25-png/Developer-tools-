<!DOCTYPE HTML>
<html>
<head>
    <title>linear-gradient</title>
<style>
.box1{height: 200px;
    background-image: linear-gradient(to bottom,orange,green);}
.box2{height: 200px;
      background-image: linear-gradient(to top,green,blue);}
.box3{height: 200px;
    background-image: linear-gradient(to left,blue,purple);}
.box4{height: 200px;
    background-image: linear-gradient(to right,grey,white);}
 .box5{height: 200px;
    background-image: linear-gradient(0deg,plum,magenta);}
 .box6{height: 200px;
    background-image: linear-gradient(90deg,yellow ,red);}
    .box7{height: 200px;
    background-image: linear-gradient(180deg,white,black);}
    .box8{height: 200px;
    background-image:linear-gradient (270deg,pink,blue);}
</style>
</head>
<body>
<div class="box1">
    <p>To bottom</p>
</div>
<div class="box2">
</div>
    <p>To top</p>
<div class="box3">
    <p>To left</p>
    </div>
<div class="box4">
    <p>To  right</p>
    </div>
<div class="box5">
    <p>To bottom right</p>
    </div>
<div class="box6">
    <p>to bottom left</p>
    </div>
<div class="box7">
    <p>to top right</p>
    </div>
<div class="box8">
    <p>to top left</p>
    </div>
</body>
</html>
