<!DOCTYPE html>
<html>
<head>
    <title>FLEX</title>
<style>
.container{
         display:flex;
         flex-wrap: wrap;
         background-color:darkgray;
         width: 350px;
         border:2px solid red;}

.box{width:50px;
     padding: 20px;
     background-color: yellowgreen;
     text-align: center;}

 .box1{align-self: flex-start;} 
 .box2{align-self: center;}  
 .box3{align-self: flex-end;} 

</style>
</head>
<body>
    <h2>CSS align self examples </h2>
<div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
</div>
</body>
</html>
