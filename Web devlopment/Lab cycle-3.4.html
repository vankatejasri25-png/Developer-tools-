<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types and Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:darkcyan;
            margin: 30px;
        }

        h1, h2 {
            color: darkblue;
        }

        .section {
            background-color: white;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid gray;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            background-color:powderblue;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>Exploring HTML5 Input Types and Location</h1>

    <div class="section">
        <h2>What are HTML5 input types?</h2>
        <p>
            HTML5 provides different input types to collect different kinds of
            information. For example, a date input helps the user choose a date,
            while an email input checks that the entry looks like an email address.
        </p>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="name@example.com">

            <label for="phone">Phone number:</label>
            <input type="tel" id="phone" name="phone">
p
            <label for="time">Preferred time:</label>
            <input type="time" id="time" name="time">

            <label for="quantity">Number of books:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10">

            <label for="rating">Rate this page (1 to 5):</label>
            <input type="range" id="rating" name="rating" min="1" max="5">

            <label for="color">Choose a favorite color:</label>
            <input type="color" id="color" name="color">

            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="section">
       
        <form>
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city">

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4"
                      placeholder="Enter your address"></textarea>

            <button type="submit">Save Location</button>
        </form>
    </div>
</body>
</html>
