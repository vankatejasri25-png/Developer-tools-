<!DOCTYPE HTML>
<html>
<head>
    <title>linear-gradient</title>
<style>
    body{
        text-align: center;
        background-color: bisque;
    }
.a{height: 200px;
   background-image: linear-gradient(45deg ,black , white);}
.b{height: 200px;
   background-image: linear-gradient(90deg , aqua, pink)}
.c{height:200px;
   background-image: linear-gradient(180deg, olive, lightblue);}
.d{height: 200px;
   background-image: linear-gradient(270deg, skyblue,purple);}
</style>
</head>
<body>
    <div>
    <div>
    <div class="a">
        45deg towards diagonl
    </div>
    </div>
    <div class="b">
        90deg towards right
    </div>
    <div class="c">
        180deg towards bottom 
    </div>
    <div class="d">
        270deg towards left 
    </div>
    </div>
</body>
</html>
