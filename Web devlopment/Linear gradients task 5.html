<!DOCTYPE HTML>
<html>
<head>
    <title>linear-gradient</title>
<style>
    body{
        text-align: center;
        background-color: bisque;
    }
.a{height: 200px;
   background-image: linear-gradient(to bottom , aqua , white);}
.d{height: 200px;
   background-image: linear-gradient(to left, skyblue,purple);}
.e{height: 200px;
background-image:repeating-linear-gradient(blue,green 20%);}
</style>
</head>
<body>
    <h1 style="text-align: center;">linear-gradient</h1>
    <div class="a">
      To Bottom
    </div>
    <div class="d">
           To left
    </div>
    <div class="e">
    reapeating linear gradient 
    </div>
</body>
</html>
