<!DOCTYPE html>
<html>
<head>
    <title>Basic Form</title>
<style> 
    h2{
        text-align: center;
    }
    form{
        text-align: center;
    }
</style> 
</head>
<body style="background-color:olive;">

<h2>Form basics</h2>

<form action="">

    <label style="color:yellow;" >Name:</label>
    <input type="text" name="name" placeholder="name" required >
    <br><br>

    <label style="color:yellow;">Email:</label>
    <input type="email" name="email" readonly>
    <br><br>

    <label style="color:yellow;">Password:</label>
    <input type="password" name="password">
    <br><br>

    <label style="color: yellow;">Fike</label>
    <input type="file" name="file">
    <br><br>
    
    <label style="color:yellow;">Image</label>
    <input type="image" name="image">
    <br><br>

    <label style="color:yellow;">Range:</label>
    <input type="range" name="range">
    <br><br>

    <label style="color:yellow;">Date:</label>
    <input type="date" name="date" id="width">
    <br><br>

    <label style="color:yellow;">Color:</label>
    <input type="color" name="color">
    <br><br>

    <label style="color:yellow;">Time:</label>
     <input type="time" name="time">
    <br><br>

    <label style="color:yellow;">Skills:</label>
    <input type="checkbox" name="skill"> Python
    <input type="checkbox" name="skill"> HTML
    <input type="checkbox" name="skill"> SQL
    <br><br>

    <label style="color:yellow;">Month:</label>
    <input type="month" name="month">
    <input type="week"  name="week">
    <br><br>

    <label style="color:yellow;">Radio:</label>
    <input type="radio" name="branch">CSD<br>
    <input type="radio" name="branch">CSM<br>

    <label style="color:yellow;">Address:</label>
    <textarea name="address" rows="4" cols="30"></textarea>
    <br><br>

     <label style="color: yellow;">Search</label>
     <input type="search" name="search" autofocus>
     <br><br>

     <label style="color: yellow;">Phone number</label>
     <input type ="phone number " name="phone number" minlength="10" maxlength="10">
     <br><br>
     

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
