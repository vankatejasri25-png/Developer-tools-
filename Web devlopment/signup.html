<!DOCTYPE HTML>
<html>
<head>
    <title>Signup</title>
<style>

    section{padding:30px;text-align:center;
      font-family: cursive;
   text-shadow: 2px 2px 2px palegreen;}

    form{background:white;padding:20px;max-width:400px;margin:auto}
       
      input,select,textarea{width:90%;padding:8px;margin:6px}
      
   button{padding:10px 30px;background:plum;color:white;border:0}
     h2{
        text-align: center;

     }
</style>
</head>
<body style="background-color: peru;"> 
    <section id="signup">
<h2>Sign Up</h2>
<form>
<input type="text" placeholder="First Name">
<input type="text" placeholder="Last Name">
<input type="text" placeholder="Username">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<input type="password" placeholder="Confirm Password">
<input type="tel" placeholder="Phone Number">
<input type="date">
<input type="number" placeholder="Age">
<select>
<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<input type="text" placeholder="City">
<input type="text" placeholder="State">
<textarea placeholder="Address"></textarea>
<button>Sign Up</button>
</form>
</section>



</body>
</html>
</body>
</html>
