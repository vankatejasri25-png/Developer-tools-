
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color:darkolivegreen;
            padding: 15px 30px;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .menu {
            display: flex;
            gap: 25px;
        }
        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 8px;
        }
        .menu a:hover {
            background-color:purple;
            color: black;
            border-radius: 5px;
        }
        .content {
            text-align: center;
            padding: 50px;
        }
        @media screen and (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .menu {
                flex-direction: column;
                text-align: center;
                width: 100%;
                gap: 10px;
            }
            .menu a {
                display: block;
                background-color:gainsboro;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            MyWebsite
        </div>
        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>
    <div class="content" id="home">
        <h1>Welcome to My Website</h1>
        <p>
            This is a responsive webpage created
            using CSS Flexbox.
        </p>
    </div>
</body>
</html>
