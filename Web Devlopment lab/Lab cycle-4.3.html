
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <style>
        body {
            background-color:whitesmoke;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background-color:grey;
            padding: 20px;
            min-height: 250px;
        }
        .box {
            background-color:maroon;
            color: white;
            padding: 30px;
            text-align: center;
            flex-grow: 1;
            flex-basis: 120px;
        }
        .box1 {
            order: 3;
        }
        .box2 {
            order: 1;
            align-self: flex-start;
        }
        .box3 {
            order: 2;
            flex-grow: 2;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox Layout</h1>

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>
</body>
</html>
